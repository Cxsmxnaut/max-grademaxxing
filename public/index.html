<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Max · Grademaxxing</title>
<style>
  /* ═══════════════════════════════════════════════════════════════════
     Max · Grademaxxing — ChatGPT-style interface infused with
     Grademaxxing DNA. Zero external dependencies.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    --sidebar-bg:     #171717;
    --bg:             #212121;
    --surface:        #2f2f2f;
    --surface-hover:  #383838;
    --surface-subtle: #262626;
    --bubble:         #2f2f2f;
    --border:         rgba(255, 255, 255, .08);
    --border-strong:  rgba(255, 255, 255, .16);
    --text:           #ececec;
    --text-dim:       #b4b4b4;
    --text-faint:     #767676;
    --accent:         #ffffff;
    --on-accent:      #171717;
    --brand-green:    #10b981;
    --brand-glow:     rgba(16, 185, 129, .18);
    --warn:           #f59e0b;
    --danger:         #ef4444;
    --radius-composer: 26px;
    --radius-bubble:  20px;
    --sidebar-w:      260px;
    --thread-w:       768px;
    --font: 'Inter', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI',
            Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* ── app layout (sidebar + main) ──────────────────────────────────── */
  .app-shell {
    display: flex;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    position: relative;
  }

  /* ── ChatGPT-style chat history sidebar ───────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    flex: none;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left .22s cubic-bezier(.22, 1, .36, 1), transform .22s cubic-bezier(.22, 1, .36, 1);
    z-index: 30;
    user-select: none;
  }
  .app-shell.sidebar-collapsed .sidebar {
    margin-left: calc(var(--sidebar-w) * -1);
  }

  .sidebar__top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px 6px;
    gap: 6px;
  }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    transition: background .14s ease, color .14s ease;
    flex: none;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, .07);
    color: var(--text);
  }
  .icon-btn svg { width: 18px; height: 18px; }

  .new-chat-row {
    padding: 4px 10px 8px;
  }
  .new-chat-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 11px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .14s ease, border-color .14s ease;
  }
  .new-chat-btn:hover {
    background: rgba(255, 255, 255, .06);
  }
  .new-chat-btn__left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .new-chat-btn__avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #071a12;
    font-size: 12px;
    font-weight: 800;
    display: grid;
    place-items: center;
    box-shadow: 0 0 12px rgba(16, 185, 129, .28);
  }
  .new-chat-btn svg { width: 16px; height: 16px; color: var(--text-dim); }

  .sidebar__section-label {
    padding: 12px 18px 6px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: .01em;
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .chat-list::-webkit-scrollbar { width: 6px; }
  .chat-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, .1);
    border-radius: 6px;
  }

  .chat-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 10px 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 13.5px;
    line-height: 1.35;
    transition: background .12s ease, color .12s ease;
  }
  .chat-item:hover {
    background: rgba(255, 255, 255, .055);
    color: var(--text);
  }
  .chat-item.is-active {
    background: rgba(255, 255, 255, .09);
    color: var(--text);
    font-weight: 500;
  }
  .chat-item__title {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item__title.is-naming {
    background: linear-gradient(90deg, var(--text) 0%, #10b981 50%, var(--text) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleShimmer 1.4s ease-in-out infinite;
  }
  @keyframes titleShimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
  .chat-item__delete {
    opacity: 0;
    width: 24px; height: 24px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-faint);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
    transition: opacity .12s ease, color .12s ease, background .12s ease;
  }
  .chat-item:hover .chat-item__delete,
  .chat-item.is-active .chat-item__delete {
    opacity: 1;
  }
  .chat-item__delete:hover {
    color: var(--text);
    background: rgba(255, 255, 255, .1);
  }
  .chat-item__delete svg { width: 14px; height: 14px; }

  .chat-list__empty {
    padding: 18px 12px;
    font-size: 12.5px;
    color: var(--text-faint);
    text-align: center;
  }

  /* ── main chat pane ───────────────────────────────────────────────── */
  .max-chat {
    flex: 1;
    min-width: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
  }

  /* header: ChatGPT minimal topbar */
  .max-chat__topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
    z-index: 10;
    flex: none;
  }
  .topbar__left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .topbar__OpenBtn {
    display: none;
  }
  .app-shell.sidebar-collapsed .topbar__OpenBtn {
    display: inline-grid;
  }

  .brand-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 10px;
    cursor: default;
  }
  .brand__name {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -.015em;
    color: var(--text);
    white-space: nowrap;
  }
  .brand__name span {
    color: var(--text-faint);
    font-weight: 500;
    font-size: 14px;
    margin-left: 3px;
  }

  .topbar__right {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  /* Active course context pill — Grademaxxing steroid HUD */
  .course-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(16, 185, 129, .09);
    border: 1px solid rgba(16, 185, 129, .24);
    color: #d1fae5;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background .14s ease, border-color .14s ease, transform .12s ease;
    white-space: nowrap;
  }
  .course-pill:hover {
    background: rgba(16, 185, 129, .15);
    border-color: rgba(16, 185, 129, .4);
  }
  .course-pill__dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brand-green);
    box-shadow: 0 0 8px var(--brand-green);
  }
  .course-pill__avg {
    font-family: var(--mono);
    font-weight: 700;
    color: #34d399;
  }

  .model-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    color: var(--text-dim);
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    font-family: var(--mono);
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .model-chip::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px rgba(16, 185, 129, .8);
  }

  /* ── scroll thread ────────────────────────────────────────────────── */
  .max-chat__scroll {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .max-chat__scroll::-webkit-scrollbar { width: 10px; }
  .max-chat__scroll::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.12);
    border-radius: 8px;
    border: 3px solid var(--bg);
  }
  .max-chat__scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); }
  .thread {
    max-width: var(--thread-w);
    margin: 0 auto;
    padding: 24px 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* ── ChatGPT + Grademaxxing welcome state ─────────────────────────── */
  .hero {
    padding: 8vh 0 2vh;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero__badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #34d399;
    background: rgba(16, 185, 129, .1);
    border: 1px solid rgba(16, 185, 129, .24);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .hero__title {
    font-size: clamp(26px, 3.8vw, 34px);
    font-weight: 600;
    letter-spacing: -.025em;
    line-height: 1.2;
    margin-bottom: 8px;
    color: var(--text);
  }
  .hero__sub {
    color: var(--text-dim);
    font-size: 14.5px;
    max-width: 480px;
    margin-bottom: 24px;
  }

  /* Quick grade snapshot card on empty state */
  .context-snapshot {
    width: 100%;
    max-width: 640px;
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    flex-wrap: wrap;
  }
  .context-snapshot__left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .context-snapshot__badge {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: rgba(16, 185, 129, .14);
    border: 1px solid rgba(16, 185, 129, .3);
    color: #34d399;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    display: grid;
    place-items: center;
  }
  .context-snapshot__course {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
  }
  .context-snapshot__meta {
    font-size: 12px;
    color: var(--text-dim);
  }
  .context-snapshot__pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mini-tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(255, 255, 255, .05);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 8px;
  }

  /* Starter prompt cards (like ChatGPT suggestions) */
  .starter-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 640px;
  }
  .starter-card {
    text-align: left;
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
    color: var(--text);
    font: inherit;
    transition: background .14s ease, border-color .14s ease, transform .12s ease;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .starter-card:hover {
    background: var(--surface);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .starter-card__title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .starter-card__sub {
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  /* ── messages ─────────────────────────────────────────────────────── */
  .msg { display: flex; flex-direction: column; animation: rise .16s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  .msg--user { align-items: flex-end; }
  .msg--user .bubble {
    background: var(--bubble);
    color: var(--text);
    padding: 11px 18px;
    border-radius: var(--radius-bubble);
    max-width: 78%;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .msg--max {
    align-items: flex-start;
    gap: 6px;
  }
  .msg--max__head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .msg--max__avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #062117;
    font-size: 11px;
    font-weight: 800;
    display: grid;
    place-items: center;
    flex: none;
  }
  .msg--max .who {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }
  .msg--max .reply {
    width: 100%;
    font-size: 15.5px;
    line-height: 1.68;
    color: var(--text);
    white-space: normal;
    overflow-wrap: anywhere;
    padding-left: 30px;
  }

  /* Rich ChatGPT-style markdown inside Max replies */
  .reply p   { margin: 0 0 .75em; }
  .reply p:last-child { margin-bottom: 0; }
  .reply strong { font-weight: 650; color: #fff; }
  .reply em     { font-style: italic; }
  .reply del    { opacity: .65; }
  .reply code {
    font-family: var(--mono);
    font-size: .87em;
    background: rgba(255,255,255,.08);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: .12em .42em;
    color: #6ee7b7;
  }
  .reply pre {
    background: #141414;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    overflow-x: auto;
    margin: .65em 0;
  }
  .reply pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
  }
  .reply ul, .reply ol { margin: .4em 0 .8em; padding-left: 1.45em; }
  .reply li { margin: .28em 0; }
  .reply li::marker { color: var(--text-dim); }
  .reply h3 {
    font-size: 16.5px;
    font-weight: 650;
    margin: 1.05em 0 .4em;
    letter-spacing: -.015em;
    color: #fff;
  }
  .reply h3:first-child { margin-top: .1em; }
  .reply hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1em 0;
  }
  .reply blockquote {
    margin: .75em 0;
    padding: 10px 14px;
    border-left: 3px solid var(--brand-green);
    background: rgba(16, 185, 129, .07);
    border-radius: 0 10px 10px 0;
  }
  .reply blockquote p { margin: 0; }

  /* ChatGPT-style clean comparison tables */
  .reply .table-wrap {
    overflow-x: auto;
    margin: .75em 0 .9em;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: #1a1a1a;
  }
  .reply table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.8px;
    line-height: 1.45;
  }
  .reply th, .reply td {
    padding: 9px 13px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .reply th {
    background: rgba(255, 255, 255, .04);
    font-weight: 650;
    color: #fff;
    font-size: 12.5px;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .reply tr:last-child td { border-bottom: none; }
  .reply tbody tr:hover { background: rgba(255, 255, 255, .025); }

  /* Message action bar (Copy) */
  .msg-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 26px;
    margin-top: 2px;
    opacity: 0;
    transition: opacity .14s ease;
  }
  .msg--max:hover .msg-actions { opacity: 1; }
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text-faint);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .action-btn:hover {
    background: rgba(255, 255, 255, .07);
    color: var(--text);
  }
  .action-btn svg { width: 13.5px; height: 13.5px; }

  .msg--error .reply { color: var(--warn); font-size: 13.5px; opacity: .92; }

  /* typing indicator */
  .typing {
    display: inline-flex;
    gap: 5px;
    padding: 12px 16px;
    margin-left: 30px;
    align-items: center;
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-bubble);
    border-top-left-radius: 6px;
  } .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--brand-green);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

   /* ── composer: ChatGPT dark pill ──────────────────────────────────── */
  .max-chat__composer-wrap {
    flex: none;
    padding: 6px 20px calc(14px + env(safe-area-inset-bottom));
  }
  .composer {
    max-width: var(--thread-w);
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-composer);
    padding: 6px 8px 6px 6px;
    display: flex;
    align-items: flex-end;
    gap: 6px;
    transition: border-color .15s ease, box-shadow .15s ease;
    box-shadow: 0 8px 28px rgba(0,0,0,.32);
  }
  .composer:focus-within {
    border-color: var(--border-strong);
    box-shadow: 0 8px 28px rgba(0,0,0,.38), 0 0 0 2px rgba(255,255,255,.04);
  }
  .composer__input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    line-height: 1.5;
    padding: 10px 8px 10px 16px;
    max-height: 180px;
    min-height: 42px;
    field-sizing: content;
    caret-color: var(--text);
  }
  .composer__input::placeholder { color: var(--text-faint); }
  .composer__input::-webkit-scrollbar { width: 6px; }
  .composer__input::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 6px; }

  .composer__send {
    flex: none;
    width: 34px; height: 34px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    display: grid; place-items: center;
    cursor: pointer;
    margin: 4px 0;
    transition: transform .12s ease, opacity .12s ease, background .12s ease;
  }
  .composer__send:hover:not(:disabled) { transform: translateY(-1px); background: #fff; }
  .composer__send:active:not(:disabled) { transform: translateY(0) scale(.96); }
  .composer__send:disabled { background: #424242; color: #6e6e6e; cursor: default; }
  .composer__send svg { width: 17px; height: 17px; }

  .fineprint {
    max-width: var(--thread-w);
    margin: 8px auto 0;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-faint);
    letter-spacing: .01em;
  }

  /* Mobile backdrop when sidebar is open on small screens */
  .sidebar-backdrop {
    display: none;
  }

  @media (max-width: 760px) {
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      margin-left: 0 !important;
      transform: translateX(0);
      box-shadow: 16px 0 40px rgba(0,0,0,.6);
    }
    .app-shell.sidebar-collapsed .sidebar {
      transform: translateX(-105%);
    }
    .sidebar-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 25;
      opacity: 1;
      transition: opacity .2s ease;
    }
    .app-shell.sidebar-collapsed .sidebar-backdrop {
      opacity: 0;
      pointer-events: none;
    }
    .topbar__OpenBtn { display: inline-grid; }
    .starter-grid { grid-template-columns: 1fr; }
    .thread { padding: 20px 14px 24px; gap: 22px; }
    .max-chat__composer-wrap { padding-inline: 12px; }
    .msg--user .bubble { max-width: 88%; }
    .msg--max .reply { padding-left: 0; }
    .msg-actions { padding-left: 0; opacity: 1; }
    .typing { margin-left: 0; }
    .brand__name span { display: none; }
  }
</style>
</head>
<body>
<div class="app-shell" id="app-shell">
  <!-- ChatGPT-style Sidebar (purpose: chat history + new chat) -->
  <aside class="sidebar" id="sidebar" aria-label="Chat history">
    <div class="sidebar__top">
      <button class="icon-btn" id="close-sidebar" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M9 3v18"/>
        </svg>
      </button>
      <button class="icon-btn" id="top-new-chat" type="button" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </button>
    </div>

    <div class="new-chat-row">
      <button class="new-chat-btn" id="new-chat-btn" type="button">
        <span class="new-chat-btn__left">
          <span class="new-chat-btn__avatar">M</span>
          <span>New chat</span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>

    <div class="sidebar__section-label">Recents</div>
    <nav class="chat-list" id="chat-list" aria-label="Recent chats"></nav>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- Main Chat Window -->
  <div class="max-chat">
    <header class="max-chat__topbar">
      <div class="topbar__left">
        <button class="icon-btn topbar__OpenBtn" id="open-sidebar" type="button" title="Open sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M9 3v18"/>
          </svg>
        </button>
        <button class="icon-btn topbar__OpenBtn" id="topbar-new-chat" type="button" title="New chat" aria-label="Start new chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
        </button>
        <div class="brand-pill">
          <div class="brand__name">Max <span>· Grademaxxing</span></div>
        </div>
      </div>

      <div class="topbar__right">
        <button class="course-pill" id="course-pill" type="button" title="Switch active course context">
          <span class="course-pill__dot"></span>
          <span id="course-pill-name">AP Chemistry</span>
          <span class="course-pill__avg" id="course-pill-avg">88.4%</span>
        </button>
        <div class="model-chip" id="model-chip">max · mesh</div>
      </div>
    </header>

    <!-- messages -->
    <main class="max-chat__scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </main>

    <!-- composer -->
    <footer class="max-chat__composer-wrap">
      <form class="composer" id="composer" autocomplete="off">
        <textarea
          class="composer__input"
          id="input"
          rows="1"
          placeholder="Ask Max anything about your grades, finals, or GPA…"
          aria-label="message max"
        ></textarea>
        <button class="composer__send" id="send" type="submit" disabled aria-label="send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="fineprint">Max can make mistakes — double-check important grade math.</p>
    </footer>
  </div>
</div>

<script type="module">
/* ═══ Max · Grademaxxing — ChatGPT-style UI + Sidebar History ═══════ */
import { renderMarkdown } from './markdown.js';

(() => {
  'use strict';

  const appShell     = document.getElementById('app-shell');
  const chatListEl   = document.getElementById('chat-list');
  const closeSidebar = document.getElementById('close-sidebar');
  const openSidebar  = document.getElementById('open-sidebar');
  const backdrop     = document.getElementById('sidebar-backdrop');
  const newChatBtn   = document.getElementById('new-chat-btn');
  const topNewChat   = document.getElementById('top-new-chat');
  const topbarNewChat = document.getElementById('topbar-new-chat');
  const coursePill   = document.getElementById('course-pill');
  const courseNameEl = document.getElementById('course-pill-name');
  const courseAvgEl  = document.getElementById('course-pill-avg');
  const modelChip    = document.getElementById('model-chip');
  const thread       = document.getElementById('thread');
  const scroll       = document.getElementById('scroll');
  const form         = document.getElementById('composer');
  const input        = document.getElementById('input');
  const sendBtn      = document.getElementById('send');

  const DEMO = new URLSearchParams(location.search).has('demo');
  const STORAGE_KEY = 'grademaxxing_max_chats_v1';
  const HISTORY_TURNS = 6;

  // Courses the user can cycle through (or active screen context passed by app)
  const COURSES = [
    {
      screen: 'course-overview',
      course: 'AP Chemistry',
      currentAverage: 88.4,
      gradingRules: 'Tests 55%, Labs 20%, Final Exam 25%. Lowest unit test is replaced by the Final Exam if Final > lowest test.',
      trend: [
        { unit: 'Unit 1 (Stoichiometry)', score: 92 },
        { unit: 'Unit 2 (Thermochemistry)', score: 78 },
        { unit: 'Unit 3 (Kinetics)', score: 91 },
      ],
      upcoming: [
        { assessment: 'Final Exam', weight: 0.25 },
        { assessment: 'Lab Practical', weight: 0.10 },
      ],
    },
    {
      screen: 'course-overview',
      course: 'AP Calculus BC',
      currentAverage: 89.1,
      gradingRules: 'Tests 50%, Homework 20% (points-based total), Final Exam 30%. Lowest test dropped IF homework average >= 90%.',
      trend: [
        { unit: 'Test 1 (Limits & Derivatives)', score: 84 },
        { unit: 'Test 2 (Integration)', score: 91 },
        { unit: 'Test 3 (Series & Taylor)', score: 72 },
      ],
      homeworkSoFar: { earned: 66, possible: 75, remainingAssignmentPoints: 25 },
      upcoming: [
        { assessment: 'Last Homework (25 pts)', weight: 'part of 20% HW pool' },
        { assessment: 'Final Exam', weight: 0.30 },
      ],
    },
    {
      screen: 'course-overview',
      course: 'AP US History',
      currentAverage: 91.6,
      gradingRules: 'Essays/DBQs 45%, Quizzes 30%, Participation 10%, Final Project 15%. 89.5% rounds up to an A (90%).',
      trend: [
        { unit: 'Period 5 DBQ', score: 94 },
        { unit: 'Period 6 LEQ', score: 88 },
      ],
      upcoming: [
        { assessment: 'Final DBQ Project', weight: 0.15 },
      ],
    },
  ];

  let courseIdx = 0;
  let STUDENT_CONTEXT = COURSES[0];

  function syncCourseUI() {
    courseNameEl.textContent = STUDENT_CONTEXT.course;
    courseAvgEl.textContent = `${STUDENT_CONTEXT.currentAverage}%`;
  }

  coursePill.addEventListener('click', () => {
    courseIdx = (courseIdx + 1) % COURSES.length;
    STUDENT_CONTEXT = COURSES[courseIdx];
    syncCourseUI();
    if (activeChat && activeChat.messages.length === 0) {
      showWelcome();
    }
  });

  /* ── sidebar toggle ───────────────────────────────────────────────── */
  const toggleSidebar = () => appShell.classList.toggle('sidebar-collapsed');
  closeSidebar.addEventListener('click', toggleSidebar);
  openSidebar.addEventListener('click', toggleSidebar);
  backdrop.addEventListener('click', () => appShell.classList.add('sidebar-collapsed'));
  if (window.innerWidth <= 760) appShell.classList.add('sidebar-collapsed');

  /* ── chat session state (persisted in localStorage) ───────────────── */
  let chats = [];
  let activeChat = null;

  function loadStoredChats() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      if (Array.isArray(parsed)) {
        chats = parsed.filter((c) => c && typeof c.id === 'string' && Array.isArray(c.messages));
      }
    } catch {
      chats = [];
    }
  }

  function saveChats() {
    try {
      // Only persist chats that actually have messages
      const nonEmpty = chats.filter((c) => c.messages.length > 0).slice(0, 40);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(nonEmpty));
    } catch {
      /* storage quota or private mode — ignore */
    }
  }

  function createSession() {
    return {
      id: 'chat_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
      title: 'New chat',
      titled: false,
      naming: false,
      course: STUDENT_CONTEXT.course,
      createdAt: Date.now(),
      messages: [],
    };
  }

  function renderSidebar() {
    chatListEl.innerHTML = '';
    const visible = chats.filter((c) => c.messages.length > 0 || c.id === activeChat?.id);

    if (visible.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'chat-list__empty';
      empty.textContent = 'Your grade chats will show up here.';
      chatListEl.appendChild(empty);
      return;
    }

    for (const chat of visible) {
      const item = document.createElement('div');
      item.className = 'chat-item' + (chat.id === activeChat?.id ? ' is-active' : '');
      item.dataset.chatId = chat.id;

      const titleSpan = document.createElement('span');
      titleSpan.className = 'chat-item__title' + (chat.naming ? ' is-naming' : '');
      titleSpan.textContent = chat.title || 'New chat';

      const delBtn = document.createElement('button');
      delBtn.className = 'chat-item__delete';
      delBtn.type = 'button';
      delBtn.title = 'Delete chat';
      delBtn.setAttribute('aria-label', `Delete ${chat.title || 'chat'}`);
      delBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`;

      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteChat(chat.id);
      });

      item.addEventListener('click', () => {
        if (busy) return;
        selectChat(chat.id);
        if (window.innerWidth <= 760) appShell.classList.add('sidebar-collapsed');
      });

      item.append(titleSpan, delBtn);
      chatListEl.appendChild(item);
    }
  }

  function selectChat(chatId) {
    const found = chats.find((c) => c.id === chatId);
    if (!found) return;
    activeChat = found;
    thread.innerHTML = '';
    if (activeChat.messages.length === 0) {
      showWelcome();
    } else {
      for (const m of activeChat.messages) {
        addMessageDOM(m.role, m.text, false);
      }
      pinBottom(true);
    }
    renderSidebar();
    input.focus();
  }

  function startNewChat() {
    if (busy) return;
    // Reuse current session if it's already an empty new chat
    if (activeChat && activeChat.messages.length === 0) {
      showWelcome();
      renderSidebar();
      input.focus();
      return;
    }
    // Remove any other empty draft sessions
    chats = chats.filter((c) => c.messages.length > 0);
    const fresh = createSession();
    chats.unshift(fresh);
    activeChat = fresh;
    showWelcome();
    renderSidebar();
    input.focus();
  }

  function deleteChat(chatId) {
    chats = chats.filter((c) => c.id !== chatId);
    saveChats();
    if (activeChat?.id === chatId) {
      if (chats.length > 0) {
        selectChat(chats[0].id);
      } else {
        const fresh = createSession();
        chats.unshift(fresh);
        activeChat = fresh;
        showWelcome();
        renderSidebar();
      }
    } else {
      renderSidebar();
    }
  }

  newChatBtn.addEventListener('click', startNewChat);
  topNewChat.addEventListener('click', startNewChat);
  topbarNewChat.addEventListener('click', startNewChat);

  /**
   * Ask one of the pooled agents to name the chat in the background, just
   * like ChatGPT names a new thread in the sidebar after the first exchange.
   */
  async function autoNameChat(chat, userQuery, assistantReply) {
    if (!chat || chat.titled || chat.naming) return;
    chat.naming = true;
    renderSidebar();
    try {
      const res = await fetch('/api/max', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          action: 'title',
          studentDataContext: STUDENT_CONTEXT,
          userQuery,
          assistantReply,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.title) {
        chat.title = data.title;
        chat.titled = true;
      } else {
        chat.title = userQuery.split(/\s+/).slice(0, 5).join(' ').slice(0, 42);
        chat.titled = true;
      }
    } catch {
      chat.title = userQuery.split(/\s+/).slice(0, 5).join(' ').slice(0, 42);
      chat.titled = true;
    } finally {
      chat.naming = false;
      saveChats();
      renderSidebar();
    }
  }

  /* ── rendering ─────────────────────────────────────────────────────── */
  const atBottom = () => scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 70;
  const pinBottom = (force = false) => {
    if (force || atBottom()) scroll.scrollTo({ top: scroll.scrollHeight, behavior: 'instant' });
  };

  function clearWelcome() {
    const hero = thread.querySelector('.hero');
    if (hero) hero.remove();
  }

  function createMaxActions(getText) {
    const bar = document.createElement('div');
    bar.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'action-btn';
    copyBtn.type = 'button';
    copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>`;
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(getText());
        const span = copyBtn.querySelector('span');
        span.textContent = 'Copied!';
        setTimeout(() => { span.textContent = 'Copy'; }, 1400);
      } catch {
        /* clipboard unavailable */
      }
    });
    bar.appendChild(copyBtn);
    return bar;
  }

  function addMessageDOM(role, text, shouldScroll = true) {
    clearWelcome();
    const msg = document.createElement('div');
    msg.className = `msg msg--${role === 'user' ? 'user' : role === 'error' ? 'max msg--error' : 'max'}`;

    if (role === 'user') {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);
    } else {
      const head = document.createElement('div');
      head.className = 'msg--max__head';
      const avatar = document.createElement('div');
      avatar.className = 'msg--max__avatar';
      avatar.textContent = 'M';
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = role === 'error' ? 'system' : 'max';
      head.append(avatar, who);

      const reply = document.createElement('div');
      reply.className = 'reply';
      if (role === 'error') reply.textContent = text;
      else reply.innerHTML = renderMarkdown(text);

      msg.append(head, reply);
      if (role !== 'error') {
        msg.appendChild(createMaxActions(() => reply.innerText));
      }
    }
    thread.appendChild(msg);
    if (shouldScroll) pinBottom(true);
    return msg;
  }

  function addTyping() {
    clearWelcome();
    const msg = document.createElement('div');
    msg.className = 'msg msg--max';
    msg.innerHTML = `
      <div class="msg--max__head">
        <div class="msg--max__avatar">M</div>
        <div class="who">max</div>
      </div>
      <div class="typing"><i></i><i></i><i></i></div>`;
    thread.appendChild(msg);
    pinBottom(true);
    return msg;
  }

  function showWelcome() {
    const c = STUDENT_CONTEXT;
    const trendTags = (c.trend || [])
      .map((t) => `<span class="mini-tag">${t.unit}: <strong>${t.score}%</strong></span>`)
      .join('');

    thread.innerHTML = `
      <div class="hero">
        <div class="hero__badge">⚡ grademaxxing · ai strategist</div>
        <h1 class="hero__title">What grade are we locking in today?</h1>
        <p class="hero__sub">Exact final-exam targets, drop-rule math, and highest-leverage study moves.</p>

        <div class="context-snapshot">
          <div class="context-snapshot__left">
            <div class="context-snapshot__badge">${c.currentAverage}%</div>
            <div>
              <div class="context-snapshot__course">${c.course}</div>
              <div class="context-snapshot__meta">${c.gradingRules || 'Active screen grade context synced'}</div>
            </div>
          </div>
          <div class="context-snapshot__pills">${trendTags}</div>
        </div>

        <div class="starter-grid">
          <button class="starter-card" type="button" data-prompt="What score do I need on the final exam to finish with at least a 90% in ${c.course}? Break down the exact math.">
            <span class="starter-card__title">🎯 Final exam target for an A</span>
            <span class="starter-card__sub">Exact score needed on the final to lock in 90%+</span>
          </button>
          <button class="starter-card" type="button" data-prompt="In my AP Calc BC class: Tests (50% weight) are 84/100, 91/100, and 72/100 — lowest test is dropped IF homework average is at least 90%. Homework (20% weight, points-based) is 66/75 so far with one 25-pt homework left. Final Exam is 30%. Compare needing 90% overall if I get 25/25 vs 20/25 on the last homework.">
            <span class="starter-card__title">🧮 Conditional drop-rule scenario</span>
            <span class="starter-card__sub">Compare 25/25 vs 20/25 HW when 90% HW unlocks a test drop</span>
          </button>
          <button class="starter-card" type="button" data-prompt="Look at my ${c.course} trend and upcoming weights. What is my highest-leverage move right now to raise my average the fastest?">
            <span class="starter-card__title">📈 Highest-leverage grade boost</span>
            <span class="starter-card__sub">Where each study hour moves your semester % the most</span>
          </button>
          <button class="starter-card" type="button" data-prompt="What happens to my ${c.course} grade under 3 scenarios on the final exam: 95% (lock in), 85% (solid), and 72% (rough day)? Put them in a table.">
            <span class="starter-card__title">📊 Best / realistic / worst-case table</span>
            <span class="starter-card__sub">See how 95%, 85%, or 72% on the final shifts your final grade</span>
          </button>
        </div>
      </div>`;

    thread.querySelectorAll('.starter-card').forEach((btn) => {
      btn.addEventListener('click', () => {
        const prompt = btn.getAttribute('data-prompt');
        if (prompt && !busy) ask(prompt);
      });
    });
  }

  /* ── composer behaviour ────────────────────────────────────────────── */
  const syncSend = () => { sendBtn.disabled = input.value.trim() === '' || busy; };

  const autoGrow = () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  };
  input.addEventListener('input', () => { autoGrow(); syncSend(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  /* ── sending ───────────────────────────────────────────────────────── */
  let busy = false;

  async function askStreamed(userQuery, historySlice, typing) {
    const res = await fetch('/api/max', {
      method: 'POST',
      headers: { 'content-type': 'application/json', accept: 'text/event-stream' },
      body: JSON.stringify({
        studentDataContext: STUDENT_CONTEXT,
        userQuery,
        history: historySlice,
        stream: true,
      }),
    });

    const ctype = res.headers.get('content-type') || '';
    if (!res.ok || !ctype.includes('text/event-stream')) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `request failed (${res.status})`);
    }
    if (!res.body) throw new Error('no response stream');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let raw = '';
    let final = null;
    let failure = null;
    let replyEl = null;
    let msgEl = null;

    const ensureReply = () => {
      if (replyEl) return replyEl;
      typing.remove();
      msgEl = document.createElement('div');
      msgEl.className = 'msg msg--max';
      const head = document.createElement('div');
      head.className = 'msg--max__head';
      const avatar = document.createElement('div');
      avatar.className = 'msg--max__avatar';
      avatar.textContent = 'M';
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = 'max';
      head.append(avatar, who);

      replyEl = document.createElement('div');
      replyEl.className = 'reply';
      msgEl.append(head, replyEl);
      msgEl.appendChild(createMaxActions(() => replyEl.innerText));
      thread.appendChild(msgEl);
      pinBottom(true);
      return replyEl;
    };

    const handle = (ev) => {
      if (typeof ev.t === 'string' && ev.t !== '') {
        raw += ev.t;
        ensureReply().innerHTML = renderMarkdown(raw);
        pinBottom();
      } else if (ev.done) {
        final = ev;
      } else if (ev.error) {
        failure = new Error(ev.error);
      }
    };

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) !== -1) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith('data:')) continue;
        try {
          handle(JSON.parse(line.slice(5)));
        } catch {
          /* malformed frame — skip */
        }
      }
    }

    if (failure) throw failure;
    const text = final?.text ?? raw;
    if (!text) throw new Error('empty response');

    typing.remove();
    if (replyEl) replyEl.innerHTML = renderMarkdown(text);
    else addMessageDOM('max', text);
    if (final?.provider) {
      modelChip.textContent = `${final.provider} · ${final.model || 'mesh'}`;
    }
    return text;
  }

  async function ask(userQuery) {
    if (busy) return;
    if (!activeChat) {
      activeChat = createSession();
      chats.unshift(activeChat);
    }

    busy = true;
    syncSend();

    const isFirstTurn = activeChat.messages.length === 0;
    const historySlice = activeChat.messages.slice(-HISTORY_TURNS);

    addMessageDOM('user', userQuery);
    activeChat.messages.push({ role: 'user', text: userQuery });

    if (isFirstTurn) {
      // Temporary provisional label while the AI naming agent runs
      activeChat.title = userQuery.split(/\s+/).slice(0, 4).join(' ').slice(0, 32) + '…';
    }
    saveChats();
    renderSidebar();

    const typing = addTyping();
    const targetChat = activeChat;

    try {
      const reply = await askStreamed(userQuery, historySlice, typing);
      targetChat.messages.push({ role: 'max', text: reply });
      saveChats();
      renderSidebar();

      if (isFirstTurn) {
        autoNameChat(targetChat, userQuery, reply);
      }
    } catch (err) {
      typing.remove();
      addMessageDOM('error', `connection error — ${err.message}`);
    } finally {
      busy = false;
      input.focus();
      syncSend();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    autoGrow();
    ask(text);
  });

  /* ── boot ──────────────────────────────────────────────────────────── */
  syncCourseUI();
  loadStoredChats();
  const initialSession = createSession();
  chats.unshift(initialSession);
  activeChat = initialSession;
  showWelcome();
  renderSidebar();
  if (DEMO) {
    modelChip.textContent = 'max · demo';
  }
  syncSend();
  input.focus();
})();
</script>
</body>
</html>
